version: '3.8'

name: 'ecommerce'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/tmp
      - POSTGRES_DB=ecommerce_main
    ports:
      - '5432:5432'
    volumes:
      - .data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning

  # E-commerce APIs
  storefront-api:
    build:
      context: .
      dockerfile: apps/storefront-api/Dockerfile
    container_name: ecommerce-storefront-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - STOREFRONT_PORT=3000
      - CATALOG_DB_HOST=postgres
      - CATALOG_DB_PORT=5432
      - CATALOG_DB_USERNAME=postgres
      - CATALOG_DB_PASSWORD=postgres
      - CATALOG_DB_DATABASE=ecommerce_catalog
      - CART_DB_HOST=postgres
      - CART_DB_PORT=5432
      - CART_DB_USERNAME=postgres
      - CART_DB_PASSWORD=postgres
      - CART_DB_DATABASE=ecommerce_cart
      - ORDER_DB_HOST=postgres
      - ORDER_DB_PORT=5432
      - ORDER_DB_USERNAME=postgres
      - ORDER_DB_PASSWORD=postgres
      - ORDER_DB_DATABASE=ecommerce_order
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PAYMENT_API_URL=http://payment-api:3002
    depends_on:
      - postgres
      - redis
      - payment-api

  admin-api:
    build:
      context: .
      dockerfile: apps/admin-api/Dockerfile
    container_name: ecommerce-admin-api
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - ADMIN_PORT=3001
      - CATALOG_DB_HOST=postgres
      - CATALOG_DB_PORT=5432
      - CATALOG_DB_USERNAME=postgres
      - CATALOG_DB_PASSWORD=postgres
      - CATALOG_DB_DATABASE=ecommerce_catalog
      - ORDER_DB_HOST=postgres
      - ORDER_DB_PORT=5432
      - ORDER_DB_USERNAME=postgres
      - ORDER_DB_PASSWORD=postgres
      - ORDER_DB_DATABASE=ecommerce_order
      - PAYMENT_DB_HOST=postgres
      - PAYMENT_DB_PORT=5432
      - PAYMENT_DB_USERNAME=postgres
      - PAYMENT_DB_PASSWORD=postgres
      - PAYMENT_DB_DATABASE=ecommerce_payment
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PAYMENT_API_URL=http://payment-api:3002
    depends_on:
      - postgres
      - redis
      - payment-api

  payment-api:
    build:
      context: .
      dockerfile: apps/payment-api/Dockerfile
    container_name: ecommerce-payment-api
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - PAYMENT_PORT=3002
      - PAYMENT_DB_HOST=postgres
      - PAYMENT_DB_PORT=5432
      - PAYMENT_DB_USERNAME=postgres
      - PAYMENT_DB_PASSWORD=postgres
      - PAYMENT_DB_DATABASE=ecommerce_payment
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PAYMENT_WEBHOOK_SECRET=webhook-secret-key
    depends_on:
      - postgres
      - redis

volumes:
  redis-data: